services:
  - type: web
    name: lanzey-mining-intelligence
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      cd backend && npm ci && npx prisma generate &&
      cd ../frontend && npm ci && VITE_API_URL=/api npm run build
    startCommand: cd backend && npx prisma migrate deploy && node src/utils/seed-if-empty.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/tmp/lanzey.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/lanzey-uploads
      - key: MAX_FILE_SIZE_MB
        value: "50"
