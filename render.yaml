databases:
  - name: lanzey-db
    databaseName: lanzey
    user: lanzey
    plan: free

services:
  - type: web
    name: lanzey
    runtime: node
    plan: free
    buildCommand: >-
      cd backend && npm ci && npx prisma generate &&
      cd ../frontend && npm ci && VITE_API_URL=/api npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    initialDeployHook: cd backend && node src/utils/seed.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lanzey-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/lanzey-uploads
      - key: MAX_FILE_SIZE_MB
        value: "50"
